<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mote">
  <rect width="512" height="512" rx="112" fill="#101418" />
  <!-- The orbit. -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7ee787" stroke-width="16" opacity="0.35" />
  <!-- A mote of light, on the orbit. -->
  <circle cx="256" cy="106" r="42" fill="#7ee787" />
  <!-- And the one it attends to. -->
  <circle cx="256" cy="256" r="34" fill="#e6edf3" />
</svg>
